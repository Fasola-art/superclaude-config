<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚢 SQL Trading - Live Dashboard</title>
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <!-- Local Styles -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="header">
        <h1>🚢 원자재 물류 트레이딩</h1>
        <div class="header-right">
            <div class="stats">
                데이터: <span id="totalRecords">-</span>건 |
                📈 매수: <span id="buySignals">-</span> |
                📉 매도: <span id="sellSignals">-</span>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span id="lastUpdate">연결 중...</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 섹터 현황 -->
        <div class="card">
            <h2>📊 섹터별 현황 (물류 유형)</h2>
            <div class="sector-grid" id="sectorGrid">
                <div class="loading">로딩 중...</div>
            </div>
        </div>

        <!-- 트레이딩 신호 -->
        <div class="card">
            <h2>🎯 트레이딩 신호</h2>
            <ul class="signal-list" id="signalList">
                <div class="loading">로딩 중...</div>
            </ul>
        </div>

        <!-- 물류 지도 -->
        <div class="card wide">
            <h2>🗺️ 물류 추적</h2>
            <div id="map"></div>
        </div>

        <!-- 종목 현황 -->
        <div class="card wide">
            <h2>📈 종목별 원자재 현황</h2>
            <div class="stock-grid" id="stockGrid">
                <div class="loading">로딩 중...</div>
            </div>
        </div>

        <!-- 경제지표 -->
        <div class="card">
            <h2>🏛️ 경제지표 (FRED)</h2>
            <div class="indicator-grid" id="indicatorGrid">
                <div class="loading">로딩 중...</div>
            </div>
        </div>

        <!-- 운임 차트 -->
        <div class="card">
            <h2>📉 운임 지수</h2>
            <div class="chart-container">
                <canvas id="freightChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Local Scripts (ES Modules) -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
