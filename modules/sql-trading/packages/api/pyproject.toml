[project]
name = "sql-trading-api"
version = "1.0.0"
description = "SQL Trading Dashboard API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
